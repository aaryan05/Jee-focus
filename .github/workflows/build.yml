name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: unzip -q JeeFocus.zip
      - run: gradle assembleDebug --no-daemon
        working-directory: JeeFocus
      - run: cp JeeFocus/app/build/outputs/apk/debug/app-debug.apk JeeFocus.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JeeFocus-apk
          path: JeeFocus.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" JeeFocus.apk --title "JeeFocus v${{ github.run_number }}" --notes "Latest build"
